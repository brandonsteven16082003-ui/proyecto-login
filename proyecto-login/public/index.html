<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro e Inicio de Sesión</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Contenedor principal del módulo de autenticación -->
  <main class="contenedor">
    <h1>Mi Aplicación</h1>

    <!-- Pestañas para alternar entre login y registro -->
    <div class="pestanas">
      <button id="tabLogin" class="activa">Iniciar sesión</button>
      <button id="tabRegistro">Registrarse</button>
    </div>

    <!-- Formulario (se usa para ambas acciones) -->
    <form id="formulario">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Escribe tu usuario" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" placeholder="Escribe tu contraseña" required>

      <button type="submit" id="botonEnviar">Iniciar sesión</button>
    </form>

    <!-- Aquí se muestran los mensajes del servicio web -->
    <p id="mensaje"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
